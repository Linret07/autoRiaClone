
spring.datasource.url=${RDS_DB_URL}
spring.datasource.username=${RDS_DB_USERNAME}
spring.datasource.password=${RDS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Перемикання зберігання фото на AWS S3
app.features.storage.provider=s3
app.features.storage.s3-bucket=${AWS_S3_BUCKET}
app.features.storage.aws-region=${AWS_REGION:eu-central-1}

# Email-повідомлення через AWS SES / SMTP
app.features.notifications.provider=${FEATURE_EMAIL_PROVIDER:smtp}

# AWS CloudWatch structured logging
logging.level.root=INFO
logging.level.com.autoriaclone=INFO
