<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AUTO.RIA Clone — продаж та купівля авто в Україні</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Верхня навігаційна панель -->
<header class="ria-navbar">
    <div class="ria-container nav-inner">
        <div class="nav-left">
            <a href="#" class="brand-logo" onclick="resetFilters();return false;">
                <span class="logo-auto">auto</span><span class="logo-ria">RIA</span><span class="logo-clone">CLONE</span>
            </a>
            <nav class="nav-links">
                <a href="#catalog" onclick="setCondition('ALL')">Вживані авто</a>
                <a href="#catalog" onclick="setCondition('NEW')">Нові авто</a>
                <a href="#catalog" onclick="filterVerified()">Перевірені авто</a>
                <span class="nav-rates" id="headerRates">Курс ПБ: завантаження...</span>
            </nav>
        </div>

        <div class="nav-right">
            <span id="userBadge" class="user-badge" style="display:none"></span>
            <button id="authOpenBtn" class="btn-outline" onclick="openAuthModal('login')">👤 Увійти</button>
            <button id="logoutBtn" class="btn-outline" onclick="logout()" style="display:none">Вийти</button>
            <button class="btn-sell" onclick="handleSellClick()">+ Продати авто</button>
        </div>
    </div>
</header>

<!-- Блок пошуку "Знаємо, бо перевірили" -->
<section class="search-hero">
    <div class="ria-container">
        <div class="search-card">
            <h1>Знаємо, бо перевірили</h1>

            <div class="condition-tabs">
                <button type="button" class="cond-tab active" data-cond="ALL" onclick="setCondition('ALL', this)">Всі</button>
                <button type="button" class="cond-tab" data-cond="USED" onclick="setCondition('USED', this)">Вживані</button>
                <button type="button" class="cond-tab" data-cond="NEW" onclick="setCondition('NEW', this)">Нові</button>
            </div>

            <div class="search-grid">
                <select id="filterBrand" onchange="updateFilterModels()">
                    <option value="">Марка (всі)</option>
                </select>

                <select id="filterModel">
                    <option value="">Модель (всі)</option>
                </select>

                <input id="filterYearFrom" type="number" placeholder="Рік випуску від (напр. 2015)">

                <input id="filterMaxPrice" type="number" placeholder="Вартість до ($)">

                <select id="filterRegion">
                    <option value="">Регіон (вся Україна)</option>
                    <option value="KYIV">Київ</option>
                    <option value="LVIV">Львів</option>
                    <option value="ODESA">Одеса</option>
                    <option value="KHARKIV">Харків</option>
                    <option value="DNIPRO">Дніпро</option>
                </select>

                <select id="filterSort" onchange="applyFilters()">
                    <option value="NEWEST">Сортування: за замовчуванням</option>
                    <option value="PRICE_ASC">Від дешевших до дорожчих</option>
                    <option value="PRICE_DESC">Від дорожчих до дешевших</option>
                    <option value="YEAR_DESC">Новіші за роком</option>
                </select>
            </div>

            <div class="search-actions">
                <button type="button" class="btn-search-red" onclick="applyFilters()">🔍 Шукати</button>
                <button type="button" class="btn-reset" onclick="resetFilters()">Скинути фільтри</button>
            </div>
        </div>

        <!-- Швидкопошук -->
        <div class="quick-search">
            <h3>Швидкопошук</h3>
            <div class="quick-pills">
                <button type="button" class="q-pill" onclick="applyQuickFilter('ALL')">
                    Усі пропозиції <span class="q-badge" id="totalCountBadge">0</span>
                </button>
                <button type="button" class="q-pill" onclick="applyQuickFilter('VERIFIED')">
                    Перевірені <span class="q-badge" id="verifiedCountBadge">0</span>
                </button>
                <button type="button" class="q-pill" onclick="applyQuickFilter('UNDER_5000')">до 5 000 $</button>
                <button type="button" class="q-pill" onclick="applyQuickFilter('LVIV')">Авто у Львові</button>
                <button type="button" class="q-pill" onclick="applyQuickFilter('KYIV')">Авто у Києві</button>
                <button type="button" class="q-pill" onclick="applyQuickFilter('BMW')">BMW</button>
            </div>
        </div>
    </div>
</section>

<!-- Стрічка оголошень -->
<main id="catalog" class="ria-container catalog-section">
    <div class="feed-header">
        <div class="feed-title-wrap">
            <h2>AUTO.RIA Clone рекомендує</h2>
        </div>
    </div>

    <div id="ads"></div>
</main>

<!-- Модальне вікно: Вхід / Реєстрація -->
<div id="authModal" class="modal-backdrop" style="display:none" onclick="closeModalOnBackdrop(event, 'authModal')">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal('authModal')">✕</button>
        <h2 id="authTitle">Вхід в особистий кабінет</h2>

        <div id="loginForm">
            <input id="email" type="email" placeholder="Email">
            <input id="password" type="password" placeholder="Пароль">
            <button onclick="login()">Увійти</button>
            <p class="modal-switch">
                Немає акаунта? <a href="#" onclick="switchAuth('register');return false;">Реєстрація</a>
            </p>
        </div>

        <div id="registerForm" style="display:none">
            <input id="regName" type="text" placeholder="Ім'я">
            <input id="regEmail" type="email" placeholder="Email">
            <input id="regPhone" type="text" placeholder="Телефон (напр. +380991234567)">
            <input id="regPassword" type="password" placeholder="Пароль">
            <select id="regRole">
                <option value="SELLER">Продавець (SELLER)</option>
                <option value="BUYER">Покупець (BUYER)</option>
            </select>
            <button onclick="register()">Зареєструватися</button>
            <p class="modal-switch">
                Вже є акаунт? <a href="#" onclick="switchAuth('login');return false;">Увійти</a>
            </p>
        </div>

        <p id="session" class="form-msg"></p>
    </div>
</div>

<!-- Модальне вікно: Додати оголошення -->
<div id="sellModal" class="modal-backdrop" style="display:none" onclick="closeModalOnBackdrop(event, 'sellModal')">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal('sellModal')">✕</button>
        <h2>Додати оголошення про продаж</h2>

        <select id="brandId" onchange="updateModels()"></select>
        <select id="modelId"></select>
        <input id="year" type="number" value="2021" placeholder="Рік випуску">
        <div class="two-cols">
            <input id="price" type="number" placeholder="Ціна">
            <select id="currency">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="UAH">UAH (грн)</option>
            </select>
        </div>
        <select id="region">
            <option value="KYIV">Київ</option>
            <option value="LVIV">Львів</option>
            <option value="ODESA">Одеса</option>
            <option value="KHARKIV">Харків</option>
            <option value="DNIPRO">Дніпро</option>
        </select>
        <textarea id="description" placeholder="Опис автомобіля (пробіг, стан, комплектація...)"></textarea>
        <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
        <button class="btn-search-red" onclick="createAd()">Опублікувати оголошення</button>
        <p id="result" class="form-msg"></p>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
