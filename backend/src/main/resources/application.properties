server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:uploads}
management.endpoints.web.exposure.include=health,info

# Cloud PostgreSQL (Neon — dev/demo database)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-crimson-wind-bhvkqvxb-pooler.c-10.eu-central-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_JO4EC7FlRhdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
app.jwt.secret=${JWT_SECRET:AutoRiaCloneSecretKey2026ForJwtSigningMustBeAtLeast256BitsLong}
app.jwt.expiration-ms=86400000

# ==========================================
# FEATURE FLAGS (Гнучке керування модулями)
# ==========================================
app.features.profanity-filter.enabled=${FEATURE_PROFANITY_ENABLED:true}
app.features.profanity-filter.max-edit-attempts=${FEATURE_PROFANITY_MAX_ATTEMPTS:3}

app.features.currency-sync.enabled=${FEATURE_CURRENCY_SYNC_ENABLED:true}
app.features.currency-sync.use-mock-fallback=${FEATURE_CURRENCY_MOCK_FALLBACK:true}

app.features.notifications.provider=${FEATURE_EMAIL_PROVIDER:mock}
app.features.notifications.manager-email=${MANAGER_EMAIL:manager@autoria.ua}

app.features.storage.provider=${FEATURE_STORAGE_PROVIDER:s3}
app.features.storage.s3-bucket=${AWS_S3_BUCKET:autoria-clone-media-prod}
app.features.storage.aws-region=${AWS_REGION:eu-central-1}

app.features.analytics.enabled=${FEATURE_ANALYTICS_ENABLED:true}
app.features.analytics.premium-only=${FEATURE_ANALYTICS_PREMIUM_ONLY:true}

app.features.dealerships.enabled=${FEATURE_DEALERSHIPS_ENABLED:true}
