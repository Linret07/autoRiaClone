<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoRia Clone</title><link rel="stylesheet" href="style.css"></head><body><header><h1>AutoRia Clone</h1><p>Платформа продажу автомобілів</p></header><main><section class="panel"><h2>Оголошення</h2><button onclick="loadAds()">Оновити</button><div id="ads"></div></section><section class="panel"><h2>Увійти</h2><input id="login" value="seller"><input id="password" type="password" value="seller"><button onclick="login()">Увійти</button><small>Демо: seller/seller, premium/premium, manager/manager, admin/admin</small><p id="session"></p></section><section class="panel"><h2>Нове оголошення</h2><input id="brand" placeholder="Марка"><input id="model" placeholder="Модель"><input id="price" type="number" placeholder="Ціна"><select id="currency"><option>USD</option><option>EUR</option><option>UAH</option></select><input id="region" value="Київ" placeholder="Регіон"><textarea id="description" placeholder="Опис"></textarea><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="createAd()">Опублікувати</button><p id="result"></p></section></main><script src="app.js"></script></body></html>
